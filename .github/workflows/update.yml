name: Update IPTV Sources

# 触发条件：定时任务 + 手动触发
on:
  schedule:
    # 每天北京时间 6:00 和 18:00 执行 (UTC 时间分别为 22:00 和 10:00)
    - cron: '0 22 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch: # 允许在 Actions 页面手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest # 使用 Ubuntu 最新环境

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # 根据项目要求调整版本

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. 运行更新脚本
      # 注意：这里的命令需根据具体项目修改，常见为 python main.py 或 python update.py
      - name: Run update script
        run: |
          python main.py 
          # 如果项目使用其他入口文件，请替换为对应的命令，例如:
          # python src/main.py
          # bash update.sh

      # 5. 提交更新后的文件
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          # 只有当有文件变动时才提交，避免空提交报错
          git diff --staged --quiet || git commit -m "Auto-update IPTV sources"
          git push
